name: Integration safety regression

on:
  push:
    branches:
      - 'integration/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full repository unit suite
        run: python -m unittest discover -s tests -v
