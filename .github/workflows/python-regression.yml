name: Python regression tests

on:
  push:
    branches:
      - 'repair/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit original 34 acceptance cases (non-gating)
        run: python -m validation.audit_legacy_labels > legacy-label-audit.json
      - name: Display compatibility summary
        run: python -c "import json; d=json.load(open('legacy-label-audit.json')); print('Legacy compatibility: %s/%s' % (d['matches'], d['total'])); print('Mismatches:', ', '.join(x['id'] for x in d['mismatches']))"
      - name: Archive read-only audit output
        uses: actions/upload-artifact@v4
        with:
          name: legacy-label-audit
          path: legacy-label-audit.json
          retention-days: 90
